name: studymed

services:
  backend:
    build:
      context: ../med-translator-backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - /opt/studymed/secrets/backend.env
    volumes:
      - backend_uploads:/app/uploads
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "node", "scripts/deploy-healthcheck.mjs"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  gateway:
    build:
      context: ..
      dockerfile: deployment/gateway.Dockerfile
      args:
        VITE_API_URL: /api/translate
    restart: unless-stopped
    env_file:
      - /opt/studymed/secrets/gateway.env
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - app_network

networks:
  # Backend must reach Atlas, R2, and Gemini; it remains private because no host
  # port is published for this service.
  app_network:

volumes:
  backend_uploads:
  caddy_data:
  caddy_config:
