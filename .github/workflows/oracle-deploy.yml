name: Test and deploy Oracle A1

on:
  push:
    branches: [main]

concurrency:
  group: oracle-a1-production
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            med-translator-backend/package-lock.json
            med-translator-frontend/package-lock.json
      - name: Test backend
        working-directory: med-translator-backend
        run: |
          npm ci
          npm test
      - name: Test, lint, and build frontend
        working-directory: med-translator-frontend
        run: |
          npm ci
          npm test
          npm run lint
          npm run build

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        env:
          DEPLOY_HOST: ${{ secrets.ORACLE_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.ORACLE_DEPLOY_USER }}
          DEPLOY_PRIVATE_KEY: ${{ secrets.ORACLE_DEPLOY_PRIVATE_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.ORACLE_DEPLOY_KNOWN_HOSTS }}
        run: |
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          test -n "$DEPLOY_PRIVATE_KEY"
          test -n "$DEPLOY_KNOWN_HOSTS"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_PRIVATE_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
      - name: Deploy after tests pass
        env:
          DEPLOY_HOST: ${{ secrets.ORACLE_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.ORACLE_DEPLOY_USER }}
        run: >-
          ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes -o StrictHostKeyChecking=yes
          "$DEPLOY_USER@$DEPLOY_HOST" 'cd /opt/studymed/app && bash deployment/deploy.sh'
